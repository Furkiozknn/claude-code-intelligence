[project]
name = "claude-code-intelligence"
version = "0.0.1"
description = "Local-first usage intelligence for Claude Code: where the tokens went, what it cost, when the quota resets."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Furki Ozkan" }]
keywords = [
    "claude-code",
    "observability",
    "telemetry",
    "cost",
    "analytics",
    "local-first",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]
dependencies = [
    "pydantic>=2.7,<3",
    "tzdata>=2026.3",
]

[project.scripts]
cci = "cci.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cci"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
