[project]
name = "cci"
version = "0.0.1"
description = "Claude Code Intelligence Platform - cekirdek (Stage 1: veri modeli)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "tzdata>=2026.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cci"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
