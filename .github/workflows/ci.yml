name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # pyproject.toml, 3.12 ve 3.13'u destekledigini soyluyor (classifiers).
    # Tek surumde kosan bir CI, digerinin bozuldugunu hic gormez.
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10  # olculen en uzun kosu 26 sn
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Sync (locked)
        run: uv sync --locked --all-extras --python ${{ matrix.python }}

      - name: Python surumu dogru mu
        run: uv run python -c "import sys; v='%d.%d' % sys.version_info[:2]; print(v); assert v == '${{ matrix.python }}', v"

      # cci/adapters ucuncu taraflarin uzatma noktasi (docs/PROVIDERS.md).
      # Uzatma noktasi oldugunu soyleyen bir projede o noktanin belgesiz
      # olmasi, pratikte kapali olmasi demek. Kapi bilerek dar: yalnizca
      # adapters/, deponun geri kalani icin boyle bir zorunluluk yok.
      - name: Adaptor sozlesmesi belgeli mi
        run: python3 arac/sozlesme-belgeli.py

      # Not `-q`. With it, pytest printed the progress dots and no summary
      # line, so the log carried no "N passed" for anything downstream to
      # read - and otomasyon/sayi-denetim.js compares the README's claimed
      # test count against exactly that line. A run whose count cannot be
      # read is a run that cannot catch the count drifting.
      - name: Run tests
        run: uv run pytest

  # The unit tests import cci.cli directly. This job runs the INSTALLED `cci`
  # binary, because both bugs found on 9 September 2026 were invisible to the
  # unit tests and only appeared when a person typed the command:
  #
  #   cci --help    -> ValueError: unsupported format character 'O'
  #   cci doctor    -> UnicodeEncodeError: '✓' in a cp1254 console
  #
  # Neither is reachable from a test that never spawns a process with a real
  # stdout attached, so this job spawns one.
  cli-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # olculen en uzun kosu 16 sn
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0

      - name: Install the package itself
        run: uv sync --locked

      # `--help` is the first thing anyone types. argparse formats every help
      # string through `%`, so one unescaped `%` in one flag's help takes the
      # whole command down - and only that subcommand's, which is why every
      # subparser is walked rather than just the root.
      - name: Every --help must exit 0
        run: |
          set -e
          uv run cci --help > /dev/null
          for cmd in $(uv run python -c "
          import argparse
          from cci.cli import build_parser
          for a in build_parser()._actions:
              if isinstance(a, argparse._SubParsersAction):
                  print(' '.join(sorted(a.choices)))
                  break
          "); do
            uv run cci "$cmd" --help > /dev/null || { echo "cci $cmd --help failed"; exit 1; }
          done
          echo "all subcommand help strings format"

      # A terminal whose code page cannot represent the report's glyphs must
      # cost you a glyph, not the report. LANG=C gives Python an ASCII stdout,
      # which is stricter than the cp1254 console this actually broke on.
      - name: doctor must survive an ASCII-only stdout
        env:
          LANG: C
          LC_ALL: C
          PYTHONIOENCODING: ""
        run: |
          set -e
          uv run cci doctor > doctor.txt
          test -s doctor.txt || { echo "doctor produced no output"; exit 1; }
          grep -q "cci " doctor.txt || { echo "doctor output does not look like a report"; exit 1; }
          echo "doctor ran with an ASCII-only stdout"

      # The extension point, exercised the way a third party would reach it.
      # cci/adapters was documented, contract-tested and UNREACHABLE: the
      # registry's `register()` was called from one test and nowhere else,
      # and every call site imported a concrete class by name. So a person
      # following docs/EXTENDING.md ended up with an object nothing would
      # ever call. The unit tests synthesise the .dist-info; this step does
      # a real install, because that is the thing being promised.
      - name: A third-party adapter installs and is reachable
        run: |
          set -e
          uv pip install ./ornekler/cci-adapter-ornek
          uv run cci --json providers > providers.json
          uv run python - <<'PY'
          import json, sys
          d = json.load(open("providers.json"))
          names = {a["name"]: a for a in d["adapters"]}
          assert d["entry_point_group"] == "cci.adapters", d["entry_point_group"]
          assert "ornek" in names, sorted(names)
          assert names["ornek"]["builtin"] is False
          assert names["ornek"]["capabilities"]["schema_verified"] is False
          assert not d["failures"], d["failures"]
          print("ornek adaptoru kurulu paketten bulundu")
          PY

      # ... and the negative control: with the package gone it must NOT be
      # listed. Otherwise the step above would pass for some other reason.
      - name: With it uninstalled, it is gone again
        run: |
          set -e
          uv pip uninstall cci-adapter-ornek
          uv run cci --json providers > after.json
          uv run python - <<'PY'
          import json
          names = [a["name"] for a in json.load(open("after.json"))["adapters"]]
          assert "ornek" not in names, names
          print("kaldirilinca listede yok:", names)
          PY

      # Exit codes are a contract: `cci today --strict` is meant to be usable
      # as a gate, and a gate whose exit code drifts is a gate that stopped
      # gating. EXIT_NO_DATA is 4 (cci/cli.py:40) - asserting the exact code,
      # not merely "non-zero", because 4 drifting to 2 would still be non-zero
      # and would still break every caller that branches on it.
      - name: Empty store exits EXIT_NO_DATA (4), not 0 and not something else
        run: |
          set +e
          uv run cci --data-dir "$RUNNER_TEMP/empty" today > /dev/null 2>&1
          code=$?
          set -e
          test "$code" -eq 4 || { echo "expected EXIT_NO_DATA=4, got $code"; exit 1; }
          echo "empty store exits 4"
